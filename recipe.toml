# The recipe's defaults. `local.toml` next to this file overrides them for one Mac (copy local.example.toml); an
# environment variable of the same name in upper case overrides both (STEPS=30 python3 -m mac generate "...").

[model]
# OpenMOSS's releases as published (bf16 transformer and prompt encoder, float32 decoder; nothing is converted).
# `checkpoint` picks one: "base" (MOSS-Image-Base) or "sft" (MOSS-Image-SFT, the same model fine-tuned: only the
# transformer's weights differ; the encoder, decoder, configs and pipeline code are byte for byte Base's).
# hf download <repo> --revision <revision> --local-dir <dir>
checkpoint = "base"
base_repo = "OpenMOSS-Team/MOSS-Image-Base"
base_revision = "85975793d8b3d432f1b6e27f352abaa4c2a4c0d3"
base_dir = "~/models/MOSS-Image-Base"
sft_repo = "OpenMOSS-Team/MOSS-Image-SFT"
sft_revision = "f972bd4b4b9e3852133cc5da954d87bc32cd8fb9"
sft_dir = "~/models/MOSS-Image-SFT"

[engine]
# TensorFold's Metal runtime with the moss_image family: a worktree of tensorfold_src at tensorfold_sha, built by
# `python3 -m mac build` under tf_cache; `binary` names a built tf-moss-image instead
tensorfold_src = "~/github/TensorFold"   # a clone holding tensorfold_sha (github.com/ashhart/TensorFold)
tensorfold_sha = "bd10bd9bdda6c350ff2dfc5873526b7b6acb59f9"            # TensorFold main (#1457, #1512)
zig = "zig"                              # Zig 0.17.0
zig_cpu = "native"
binary = ""

[local]
tf_cache = "~/.cache/moss-image"
# torch, diffusers and transformers for the prompt encoder and the decoder (python3 -m mac setup)
python = "python3"

[sample]
# The card's sampling: 50 Euler steps, guidance 3, an empty negative prompt whose pass skips block 22 (fixed)
width = 1024
height = 1024
steps = 50
seed = 42
negative = ""
device = "mps"                           # where torch runs the encoder and the decoder
